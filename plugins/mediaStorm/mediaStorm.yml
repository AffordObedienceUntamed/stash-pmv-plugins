name: Media Storm
description: Opens its own tab in which random images and videos from your library appear in waves – with media mix, volume, fades, eight layouts, effects, moods, folder and tag filters, waves on the beat of a song, optional RedGifs, hotkeys and Random Backgrounds support.
version: 2.0.0
url: https://github.com/anonym88312/stash-pmv-plugins

# Backend for RedGifs: suggestions in the panel of the Stash interface and downloads into the library
exec:
  - python
  - "{pluginDir}/rgbackend.py"
interface: raw

ui:
  javascript:
    - mediaStorm.js
  css:
    - mediaStorm.css
  # Only web/ is served (stage page and beat detection) – never the backend or its .cache
  assets:
    /: web
