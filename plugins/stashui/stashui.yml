name: Stash UI
description: A complete new interface for Stash in the Media Storm look – browsing, player, image viewer, folders, tags, queue, tasks and all settings. Opens instead of the Stash home page; classic Stash stays available in the same look. Links to Media Storm and the PMV Generator when they're installed.
version: 3.12.3
url: https://github.com/anonym88312/stash-pmv-plugins
settings:
  keepClassicHome:
    displayName: Keep classic home page
    description: When on, opening Stash keeps showing classic Stash instead of Stash UI.
    type: BOOLEAN
ui:
  javascript:
    - classic/classic.js
  css:
    - classic/classic.css
  assets:
    /: app
