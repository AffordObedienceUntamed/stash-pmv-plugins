name: Stash UI
description: A complete new interface for Stash in the Media Storm look – browsing, player, image viewer, folders, tags, queue, tasks, all settings and the PMV Generator. Opens instead of the Stash home page; classic Stash stays available in the same look.
version: 2.0.0
url: https://github.com/anonym88312/stash-pmv-plugins
# Small backend (PMV Generator: saving recordings into the library)
exec:
  - python
  - "{pluginDir}/backend.py"
interface: raw

settings:
  keepClassicHome:
    displayName: Keep classic home page
    description: When on, opening Stash keeps showing classic Stash instead of Stash UI.
    type: BOOLEAN
ui:
  javascript:
    - classic/classic.js
  css:
    - classic/classic.css
  assets:
    /: app
